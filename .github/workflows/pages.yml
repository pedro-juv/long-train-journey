# Publica a versão web do jogo no GitHub Pages a cada push na main.
# Link: https://pedro-juv.github.io/long-train-journey/
# Requer: repositório público e Settings -> Pages -> Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot e modelos de exportação
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q templates.tpz -d "$HOME/tpz"
          mv "$HOME/tpz/templates/"* "$tpl/"
          rm -f godot.zip templates.tpz

      - name: Exportar para Web
        run: |
          echo "main ($(git rev-parse --short HEAD))" > build_info.txt
          mkdir -p build/web
          "$HOME/godot/godot" --headless --path . --import || true
          "$HOME/godot/godot" --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.pck

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
